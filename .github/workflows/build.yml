name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MiniLLM-android-project.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
        working-directory: MiniLLM
      - uses: actions/upload-artifact@v4
        with:
          name: MiniLLM-debug-apk
          path: MiniLLM/app/build/outputs/apk/debug/*.apk
